site_name: recoverr
site_url: https://beatsbywoni.github.io/recoverr/
repo_url: https://github.com/beatsbywoni/recoverr
theme:
  name: material
nav:
  - Home: index.md
  - Methods: methods.md
  - API reference: api.md
